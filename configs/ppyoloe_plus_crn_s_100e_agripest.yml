# 赛题一 agripest 换 backbone 对照实验：PP-YOLOE+_S（CSPResNet-s + CustomCSPPAN + PPYOLOEHead）
# 目的：与 PicoDet-L（val 0.3694 / 0.6044）做同数据、同尺度、同批大小的架构对照
# 基准：官方 ppyoloe_plus_crn_s_80e_coco.yml（本仓库 configs/ppyoloe/），差异：
#   num_classes 80→14；数据集换 agripest r2 同款（train_r2_balanced + 15% 空图负样本）；
#   epoch 80→100（余弦同步 100，warmup 5→2）；lr 0.001@bs64 → 2e-4@bs12（线性缩放）；
#   多尺度 320~768 → 576~704（对齐 r2 配方；960 消融已证分布外尺度有害）；
#   TrainReader batch 8→12；log_iter 100；snapshot_epoch 5
# 备注：PP-YOLOE 为 softmax 头（PicoDet 为 sigmoid 无背景类），置信度分布不同，
#   demo 阈值若日后接入需单独标定；参数量 7.93M（PicoDet-L 5.81M）。

use_gpu: true
use_xpu: false
use_mlu: false
use_npu: false
use_gcu: false
log_iter: 100
save_dir: output
snapshot_epoch: 5
print_flops: false
print_params: false

export:
  post_process: True
  nms: True
  benchmark: False
  fuse_conv_bn: False

metric: COCO
num_classes: 14
# COCO 80e 全量检测权重：backbone/neck 正常加载，head 分类层因类别数不同自动跳过（微调标准做法）
pretrain_weights: https://bj.bcebos.com/v1/paddledet/models/ppyoloe_plus_crn_s_80e_coco.pdparams
weights: output/ppyoloe_s_agripest/best_model
depth_mult: 0.33
width_mult: 0.50

epoch: 100

# ---- optimizer（官方 base_lr 0.001@bs64 → 单卡 bs12 线性缩放 = 2e-4）----
LearningRate:
  base_lr: 0.0002
  schedulers:
    - name: CosineDecay
      max_epochs: 100
    - name: LinearWarmup
      start_factor: 0.
      epochs: 2

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.0005
    type: L2

architecture: YOLOv3
norm_type: sync_bn
use_ema: true
ema_decay: 0.9998
ema_black_list: ['proj_conv.weight']
custom_black_list: ['reduce_mean']

YOLOv3:
  backbone: CSPResNet
  neck: CustomCSPPAN
  yolo_head: PPYOLOEHead
  post_process: ~

CSPResNet:
  layers: [3, 6, 6, 3]
  channels: [64, 128, 256, 512, 1024]
  return_idx: [1, 2, 3]
  use_large_stem: True
  use_alpha: True

CustomCSPPAN:
  out_channels: [768, 384, 192]
  stage_num: 1
  block_num: 3
  act: 'swish'
  spp: true

PPYOLOEHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 30
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 300
    score_threshold: 0.01
    nms_threshold: 0.7

# ---- data（与 r2 完全一致：train_r2_balanced + 15% 空图负样本，控制变量只换网络）----
TrainDataset:
  name: COCODataSet
  image_dir: images/train
  anno_path: annotations/train_r2_balanced.json
  dataset_dir: ../agripest/dataset
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']
  allow_empty: true
  empty_ratio: 0.15

EvalDataset:
  name: COCODataSet
  image_dir: images/val
  anno_path: annotations/val.json
  dataset_dir: ../agripest/dataset
  allow_empty: true

TestDataset:
  name: ImageFolder
  image_dir: images/val
  anno_path: annotations/val.json
  dataset_dir: ../agripest/dataset

worker_num: 4
eval_height: &eval_height 640
eval_width: &eval_width 640
eval_size: &eval_size [*eval_height, *eval_width]

TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [576, 608, 640, 672, 704], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadGT: {}
  batch_size: 12
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 4

TestReader:
  inputs_def:
    image_shape: [3, *eval_height, *eval_width]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *eval_size, keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1
