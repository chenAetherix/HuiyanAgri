# ==================================================================
# agriweed 第二参赛作品主力模型：PP-PicoDet-L 640 (LCNet-2.0x)
# 数据集：CottonWeedDet12（5648 图 / 9370 框 / 12 类杂草，Zenodo 7535814）
# 与 agripest 主力配置同架构同超参，仅改：num_classes 14→12、数据路径、save_dir。
# 从 PaddleDetection 仓库根目录启动：
#   python tools/train.py -c ../agriweed/configs/picodet_l_640_agriweed.yml --eval --use_vdl True
# ==================================================================

metric: COCO
# PicoDet 为 sigmoid 无背景类头：num_classes = 类别数（不加 1，写 13 会 KeyError）
num_classes: 12

architecture: PicoDet
pretrain_weights: https://paddle-imagenet-models-name.bj.bcebos.com/dygraph/legendary_models/PPLCNet_x2_0_pretrained.pdparams
weights: output/picodet_l_640_agriweed/best_model
find_unused_parameters: True
use_ema: true
epoch: 200
snapshot_epoch: 10

# ---- runtime ----
use_gpu: true
log_iter: 20
# checkpoint 落盘目录（epoch 快照与 best_model 都存这里，不是 weights 字段）
save_dir: output/picodet_l_640_agriweed
export:
  post_process: True
  nms: True
  benchmark: False
  fuse_conv_bn: False

PicoDet:
  backbone: LCNet
  neck: LCPAN
  head: PicoHeadV2

LCNet:
  scale: 2.0
  feature_maps: [3, 4, 5]

LCPAN:
  out_channels: 160
  use_depthwise: True
  num_features: 4

PicoHeadV2:
  conv_feat:
    name: PicoFeat
    feat_in: 160
    feat_out: 160
    num_convs: 4
    num_fpn_stride: 4
    norm_type: bn
    share_cls_reg: True
    use_se: True
  fpn_stride: [8, 16, 32, 64]
  feat_in_chan: 160
  prior_prob: 0.01
  reg_max: 7
  cell_offset: 0.5
  grid_cell_scale: 5.0
  static_assigner_epoch: 100
  use_align_head: True
  static_assigner:
    name: ATSSAssigner
    topk: 9
    force_gt_matching: False
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  loss_class:
    name: VarifocalLoss
    use_sigmoid: False
    iou_weighted: True
    loss_weight: 1.0
  loss_dfl:
    name: DistributionFocalLoss
    loss_weight: 0.5
  loss_bbox:
    name: GIoULoss
    loss_weight: 2.5
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.025
    nms_threshold: 0.6

# ---- data（布局：PaddleDetection/ 与 agriweed/ 并排；从 PaddleDetection/ 目录启动训练）----
# 数据已就绪（2026-10-04）：dataset/images 硬链接全量 5648 图；分层划分 3661/1134/853
# 主口径用 train_balanced.json（弱类过采样 16.9:1→5.3:1，5613 图）；对标口径 *_official.json 备用
# 注：数据集内无背景图（体检实证每图≥1框），allow_empty 为无害空转；负样本实验后续用 CWFID 外部图
TrainDataset:
  name: COCODataSet
  image_dir: images
  anno_path: annotations/train_balanced.json
  dataset_dir: ../agriweed/dataset640
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: images
  anno_path: annotations/val.json
  dataset_dir: ../agriweed/dataset640

TestDataset:
  name: ImageFolder
  image_dir: images
  anno_path: annotations/val.json
  dataset_dir: ../agriweed/dataset640

worker_num: 4
eval_height: &eval_height 640
eval_width: &eval_width 640
eval_size: &eval_size [*eval_height, *eval_width]

# ---- reader（官方 640 多尺度 + 田间增强 RandomExpand）----
TrainReader:
  sample_transforms:
  - Decode: {}
  - RandomExpand: {fill_value: [114, 114, 114]}
  - RandomCrop: {}
  - RandomFlip: {prob: 0.5}
  - RandomDistort: {}
  batch_transforms:
  - BatchRandomResize: {target_size: [576, 608, 640, 672, 704], random_size: True, random_interp: True, keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229,0.224,0.225]}
  - Permute: {}
  - PadGT: {}
  batch_size: 12   # 服务器 3090 24G；4070 8G 本地复跑需 -o TrainReader.batch_size=4 LearningRate.base_lr=0.005
  shuffle: true
  drop_last: true

EvalReader:
  sample_transforms:
  - Decode: {}
  - Resize: {interp: 2, target_size: *eval_size, keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229,0.224,0.225]}
  - Permute: {}
  batch_transforms:
  - PadBatch: {pad_to_stride: 32}
  batch_size: 4
  shuffle: false

TestReader:
  inputs_def:
    image_shape: [1, 3, *eval_height, *eval_width]
  sample_transforms:
  - Decode: {}
  - Resize: {interp: 2, target_size: *eval_size, keep_ratio: False}
  - NormalizeImage: {is_scale: true, mean: [0.485,0.456,0.406], std: [0.229,0.224,0.225]}
  - Permute: {}
  batch_size: 1

# ---- optimizer（官方 batch 48 lr 0.06 线性缩放：3090 batch 12 → 0.015；本地 batch 4 → 0.005）----
LearningRate:
  base_lr: 0.015
  schedulers:
  - name: CosineDecay
    max_epochs: 200
  - name: LinearWarmup
    start_factor: 0.1
    steps: 500

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    type: Momentum
  regularizer:
    factor: 0.00004
    type: L2
